name: rustdesk-m0
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # The import is a host-owned 0600 secret file. Root is limited to this dev container.
    user: "0:0"
    command: ["start-dev", "--import-realm", "--hostname=http://127.0.0.1:18080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - ./.runtime/realm.json:/opt/keycloak/data/import/realm.json:ro
      - keycloak:/opt/keycloak/data
  postgres:
    image: ${M0_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: rustdesk_m0
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustdesk_m0 -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  keycloak:
  postgres:
    # Keep explicitly selected alternate major versions out of the default data volume.
    name: rustdesk-m0_postgres-${M0_POSTGRES_DATA_VERSION:-16}
