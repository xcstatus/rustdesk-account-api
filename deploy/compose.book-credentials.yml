# Optional with any backend and with the OIDC / Traefik overlays.
# Local Compose file secrets preserve the host file's owner and mode.
services:
  api:
    environment:
      RD_BOOK_KEYS_FILE: /run/secrets/book_keys
    secrets:
      - book_keys
secrets:
  book_keys:
    file: ${RD_BOOK_KEYS_HOST_FILE:-./.secrets/book_keys.json}
